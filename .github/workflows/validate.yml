name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests and validators
        run: |
          python3 -m py_compile enrichment/*.py scripts/*.py
          python3 -m pytest -q
          python3 scripts/validate_repo.py
          python3 scripts/validate_manifest.py assets/test-data/enrichment.csv --check-paths

      - name: Run ORA and ranked analyses
        run: |
          PYTHONPATH=. python3 -m enrichment.cli --gene-sets assets/test-data/genesets.tsv --query assets/test-data/query_genes.txt --universe assets/test-data/universe_genes.txt --mode ora --output /tmp/ora.tsv
          PYTHONPATH=. python3 -m enrichment.cli --gene-sets assets/test-data/genesets.tsv --query assets/test-data/ranked_genes.tsv --mode ranked --output /tmp/ranked.tsv
          grep -q 'GO_FIXTURE_REPAIR' /tmp/ora.tsv
          grep -q 'RANKED_DESCRIPTIVE' /tmp/ranked.tsv

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Nextflow
        run: |
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/nxf-home"
          curl -fsSL https://github.com/nextflow-io/nextflow/releases/download/v24.04.6/nextflow -o "$HOME/.local/bin/nextflow"
          chmod +x "$HOME/.local/bin/nextflow"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          NXF_HOME="$RUNNER_TEMP/nxf-home" nextflow -version

      - name: Run DSL2 stub workflow
        env:
          NXF_HOME: ${{ runner.temp }}/nxf-home
          NXF_ANSI_LOG: 'false'
        run: nextflow run main.nf -profile test -stub-run --outdir /tmp/enrichment-results -ansi-log false
